
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quadratische Funktionen</title>


    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.js"></script>
    <script id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3.0.1/es5/tex-mml-chtml.js">
    </script>
</head>

<body>

    <h1>Grundsatz</h1>

    <p>
        Eine quadratische Funktion basiert auf einer quadrierten Variable.
        Wenn man das in einem Koordinatensystem darstellt, erhält man eine Normalparabel:
    </p>
    <p>\[f(x) = x^2\]</p>

    <div id="ggb1"></div>

    <script>
        var params = {
            appName: "classic",
            width: window.innerWidth,
            height:400,
            showToolBar: false,
            showMenuBar: false,
            showAlgebraInput: true,
            showResetIcon: true,
            filename: "./ggb/1.ggb"
        };

        var applet = new GGBApplet(params, true);

        window.addEventListener("load", function() {
            applet.inject("ggb1");
        });
    </script>

</body>
</html>
